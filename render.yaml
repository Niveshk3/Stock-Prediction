services:
  - type: web
    name: stock-prediction-api
    runtime: python
    pythonVersion: 3.14.3
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: OPENROUTER_API_KEY
        value: set-this-in-render-dashboard

  - type: static
    name: stock-prediction-ui
    rootDir: frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /api/*
        destination: https://stock-prediction-api.onrender.com/*
